<div class="card auth-card">
  <h2>Iniciar sesión</h2>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" placeholder="ana@correo.com" />
      @if (hasError('email', 'required')) {
        <span class="field-error">El correo es obligatorio</span>
      } @else if (hasError('email', 'email')) {
        <span class="field-error">Ingresa un correo electrónico válido</span>
      }
    </label>

    <label>
      Contraseña
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (hasError('password', 'required')) {
        <span class="field-error">La contraseña es obligatoria</span>
      }
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Ingresando...' : 'Entrar' }}
    </button>
  </form>
  <p class="auth-link">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
</div>
