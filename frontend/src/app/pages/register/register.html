<div class="card auth-card">
  <h2>Crear cuenta</h2>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      Nombre
      <input type="text" formControlName="name" autocomplete="name" placeholder="Ana García" />
      @if (hasError('name', 'required')) {
        <span class="field-error">El nombre es obligatorio</span>
      } @else if (hasError('name', 'maxlength')) {
        <span class="field-error">Máximo 100 caracteres</span>
      }
    </label>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" placeholder="ana@correo.com" />
      @if (hasError('email', 'required')) {
        <span class="field-error">El correo es obligatorio</span>
      } @else if (hasError('email', 'email')) {
        <span class="field-error">Ingresa un correo electrónico válido</span>
      }
    </label>

    <label>
      Teléfono (opcional)
      <input type="tel" formControlName="phone" autocomplete="tel" placeholder="3001234567" />
      @if (hasError('phone', 'maxlength')) {
        <span class="field-error">Máximo 20 caracteres</span>
      }
    </label>

    <label>
      Contraseña (mín. 8)
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (hasError('password', 'required')) {
        <span class="field-error">La contraseña es obligatoria</span>
      } @else if (hasError('password', 'minlength')) {
        <span class="field-error">Debe tener al menos 8 caracteres</span>
      } @else if (hasError('password', 'maxlength')) {
        <span class="field-error">Máximo 72 caracteres</span>
      }
    </label>

    <label>
      Confirmar contraseña
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
      @if (hasError('confirmPassword', 'required')) {
        <span class="field-error">Confirma tu contraseña</span>
      } @else if (hasPasswordMismatch()) {
        <span class="field-error">Las contraseñas no coinciden</span>
      }
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Registrando...' : 'Registrarme' }}
    </button>
  </form>
  <p class="auth-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
</div>
